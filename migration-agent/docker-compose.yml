version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: migration_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    env_file: .env
    environment:
      MIGRATION_AGENT_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/migration_agent
      MIGRATION_AGENT_ENV: dev
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./agent/src:/app/src:ro

  dashboard:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    env_file: .env
    environment:
      NEXT_PUBLIC_AGENT_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules

  graph-stub:
    build:
      context: ./scripts/stubs
      dockerfile: Dockerfile.graph
    ports:
      - "8001:8001"

  google-stub:
    build:
      context: ./scripts/stubs
      dockerfile: Dockerfile.google
    ports:
      - "8002:8002"

  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    ports:
      - "4443:4443"
    command: ["-scheme", "http", "-port", "4443"]

volumes:
  postgres_data:
  dashboard_node_modules:
