display_information:
  name: Migration Agent
  description: Enterprise migration orchestration with per-phase human gates
  background_color: "#1a1a2e"

features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
  slash_commands:
    - command: /ping
      description: Health check -- confirms the agent is reachable
      usage_hint: ""
      should_escape: false
  bot_user:
    display_name: Migration Agent
    always_online: true

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:read
      - chat:write
      - commands
      - im:write
      - users:read
      - users:read.email

settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
