name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  agent:
    name: Agent (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: migration_agent
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIGRATION_AGENT_ENV: dev
      MIGRATION_AGENT_SECRET_KEY: ci-secret
      MIGRATION_AGENT_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/migration_agent
      MIGRATION_AGENT_SLACK_BOT_TOKEN: xoxb-dev-placeholder
      MIGRATION_AGENT_SLACK_SIGNING_SECRET: dev-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests

      - name: Type check (mypy)
        run: mypy src

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Unit tests
        run: pytest tests/unit -q --cov=agent --cov-report=term-missing

      - name: Integration tests
        run: pytest tests/integration -q

  dashboard:
    name: Dashboard (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
